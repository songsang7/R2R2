    - numpy==1.24.1
    - omegaconf==2.3.0
    - optax==0.2.2
    - pandas==2.1.4
    - Shimmy==2.0.0
    - tensorflow-probability==0.24.0
    - termcolor==2.4.0
    - tqdm==4.66.1
    - wandb==0.16.6
